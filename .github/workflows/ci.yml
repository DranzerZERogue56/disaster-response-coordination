name: CI

on:
  push:
  pull_request:
    branches: [main]

# The token can only read the repository (DEF-041). Nothing here needs to write, comment or publish.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      # Actions are pinned to full commit hashes (a tag can be moved); the comment names the tag each hash was resolved from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false  # the token is not left in .git/config for later steps to read

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install "pip==26.2.2"
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Secrets check
        run: script/secrets-check

      - name: Lint
        run: script/lint

      - name: Test
        run: script/test

      - name: Build
        run: script/build

      - name: Smoke
        run: script/smoke
