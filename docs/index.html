<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Capstone Dashboard</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <h1>Disaster Response Coordination — Capstone Dashboard</h1>
    <span id="todayLine" class="status-line">—</span>
  </header>

  <main>
    <section class="card" id="currentWeekCard">
      <h2>This week</h2>
      <div id="currentWeekBody">Loading…</div>
    </section>

    <section class="card">
      <h2>Hours this week</h2>
      <div id="weekHoursBody">Loading…</div>
    </section>

    <section class="card">
      <h2>Cumulative progress</h2>
      <div id="totalHoursBody">Loading…</div>
    </section>

    <section class="card">
      <h2>Coming up</h2>
      <div id="upcomingBody">Loading…</div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
